<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanad AI - صانع الإعلانات الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen pb-12">
    <!-- Header -->
    <header class="border-b border-slate-800 p-4 sticky top-0 bg-slate-900/90 backdrop-blur z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">Sanad AI 🚀</h1>
            <span class="text-xs bg-indigo-500/20 text-indigo-300 px-2.5 py-1 rounded-full border border-indigo-500/30">إصدار MVP المباشر</span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">
        <div class="bg-gradient-to-br from-indigo-900/50 to-slate-800 border border-indigo-500/30 rounded-2xl p-4 text-center">
            <h2 class="text-lg font-bold text-indigo-200 mb-1">موظف التسويق الذكي بانتظارك</h2>
            <p class="text-xs text-slate-400">أدخل معلومات العرض، اختر سفير علامتك التجارية، واترك الباقي لسند.</p>
        </div>

        <!-- Key Input Option if ENV is not set -->
        <div id="apiKeyContainer" class="bg-slate-800/80 border border-amber-500/30 p-3 rounded-xl text-xs space-y-2">
            <label class="block text-amber-300 font-semibold">مفتاح Gemini API (إن لم تفعل متغيّرات البيئة):</label>
            <input type="password" id="manualApiKey" placeholder="الصق المفتاح هنا للتجربة الفورية" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-amber-500 text-xs">
        </div>

        <form id="adForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">اسم النشاط التجاري / المنتج</label>
                <input type="text" id="brandName" required placeholder="مثال: مطعم الوجبة المميزة" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500 text-white">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">تفاصيل العرض أو الإعلان</label>
                <textarea id="offerDetails" rows="3" required placeholder="مثال: عرض البيتزا المارجريتا بس بـ 3 دنانير مع مشروب" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500 text-white"></textarea>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2">اختر سفير الإعلان (AI Ambassador)</label>
                <div class="grid grid-cols-3 gap-2" id="characterOptions">
                    <label class="cursor-pointer border-2 border-indigo-500 bg-indigo-950/40 rounded-xl p-2 text-center transition flex flex-col items-center">
                        <input type="radio" name="character" value="سند (شاب أنيق بملابس كاجوال عصرية)" checked class="hidden">
                        <div class="w-12 h-12 bg-indigo-600 rounded-full flex items-center justify-center font-bold text-lg mb-1">👨‍💼</div>
                        <span class="text-xs font-bold block">سند</span>
                        <span class="text-[10px] text-slate-400 block">شبابي/أنيق</span>
                    </label>
                    <label class="cursor-pointer border border-slate-700 bg-slate-800 rounded-xl p-2 text-center transition flex flex-col items-center">
                        <input type="radio" name="character" value="ليان (فتاة عربية حيوية وبشوشة)" class="hidden">
                        <div class="w-12 h-12 bg-pink-600 rounded-full flex items-center justify-center font-bold text-lg mb-1">👩‍💼</div>
                        <span class="text-xs font-bold block">ليان</span>
                        <span class="text-[10px] text-slate-400 block">حيوية/عصرية</span>
                    </label>
                    <label class="cursor-pointer border border-slate-700 bg-slate-800 rounded-xl p-2 text-center transition flex flex-col items-center">
                        <input type="radio" name="character" value="تيكو (شخصية كرتونية 3D لطيفة)" class="hidden">
                        <div class="w-12 h-12 bg-amber-600 rounded-full flex items-center justify-center font-bold text-lg mb-1">🤖</div>
                        <span class="text-xs font-bold block">تيكو</span>
                        <span class="text-[10px] text-slate-400 block">3D/مرح</span>
                    </label>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition duration-200 flex justify-center items-center gap-2">
                <span>توليد الحملة بالذكاء الاصطناعي</span>
                <span>✨</span>
            </button>
        </form>

        <div id="loadingView" class="hidden text-center py-8 space-y-3">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent"></div>
            <p class="text-sm font-semibold text-indigo-300">جاري كتابة السيناريو وتصميم الصورة بواسطة AI...</p>
        </div>

        <div id="resultView" class="hidden space-y-4">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 space-y-3">
                <h3 class="text-sm font-bold text-indigo-400 flex items-center gap-2">
                    <span>🖼️</span> صورة السفير مع المنتج
                </h3>
                <div class="relative rounded-xl overflow-hidden bg-slate-900 border border-slate-800 aspect-square flex items-center justify-center">
                    <img id="aiImage" src="" alt="AI Visual" class="w-full h-full object-cover hidden">
                    <span id="imageLoader" class="text-xs text-slate-500 animate-pulse">جاري رسم المشهد...</span>
                </div>
            </div>

            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 space-y-3">
                <h3 class="text-sm font-bold text-indigo-400 flex items-center gap-2">
                    <span>🎬</span> سيناريو الإعلان (Reels / TikTok)
                </h3>
                <div id="scriptOutput" class="text-xs text-slate-300 leading-relaxed whitespace-pre-line bg-slate-900/60 p-3 rounded-xl border border-slate-800"></div>
            </div>

            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 space-y-3">
                <h3 class="text-sm font-bold text-indigo-400 flex items-center gap-2">
                    <span>📝</span> المنشور والكابشن
                </h3>
                <div id="captionOutput" class="text-xs text-slate-300 leading-relaxed whitespace-pre-line bg-slate-900/60 p-3 rounded-xl border border-slate-800"></div>
            </div>
        </div>
    </main>

    <script>
        document.querySelectorAll('input[name="character"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                document.querySelectorAll('#characterOptions label').forEach(l => {
                    l.classList.remove('border-indigo-500', 'bg-indigo-950/40');
                    l.classList.add('border-slate-700', 'bg-slate-800');
                });
                e.target.closest('label').classList.remove('border-slate-700', 'bg-slate-800');
                e.target.closest('label').classList.add('border-indigo-500', 'bg-indigo-950/40');
            });
        });

        document.getElementById('adForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const manualKey = document.getElementById('manualApiKey').value.trim();
            const apiKey = manualKey;

            if (!apiKey) {
                alert('يرجى وضع API Key في الحقل المخصص أعلى الصفحة لتشغيل الذكاء الاصطناعي.');
                return;
            }

            document.getElementById('loadingView').classList.remove('hidden');
            document.getElementById('resultView').classList.add('hidden');
            document.getElementById('aiImage').classList.add('hidden');
            document.getElementById('imageLoader').classList.remove('hidden');

            const brand = document.getElementById('brandName').value;
            const offer = document.getElementById('offerDetails').value;
            const character = document.querySelector('input[name="character"]:checked').value;

            try {
                const prompt = `أنت خبير تسويق إعلاني. قم بكتابة حملة إعلانية قصيرة بأسلوب جذّاب وبلهمة عربية محببة لمشروع (${brand}) وعرضه (${offer}). 
الشخصية التي ستظهر هي (${character}).

قسّم إجابتك بالضبط إلى قسمين واضحين بنفس النمط التالي:
---السيناريو---
[اكتب سيناريو إعلان فيديو قصير Reels 15 ثانية مقسم إلى مشاهد مع حركة الشخصية]

---الكابشن---
[اكتب منشور انستغرام/تيك توك جذّاب مع إيموجيز وهاشتاغات مناسبة]`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message || 'خطأ في المفتاح');
                }

                const textResult = data.candidates[0].content.parts[0].text;
                const parts = textResult.split('---الكابشن---');
                const scriptText = parts[0] ? parts[0].replace('---السيناريو---', '').trim() : textResult;
                const captionText = parts[1] ? parts[1].trim() : '';

                document.getElementById('scriptOutput').innerText = scriptText;
                document.getElementById('captionOutput').innerText = captionText;

                // Generate AI Image using Pollinations AI
                const imagePrompt = encodeURIComponent(`A high quality professional photo of ${character} presenting ${brand} ${offer}, commercial advertisement photo, 8k resolution, realistic lighting`);
                const imageUrl = `https://image.pollinations.ai/prompt/${imagePrompt}?width=800&height=800&nologo=true&seed=${Math.floor(Math.random() * 1000)}`;

                const imgElement = document.getElementById('aiImage');
                imgElement.src = imageUrl;
                imgElement.onload = () => {
                    document.getElementById('imageLoader').classList.add('hidden');
                    imgElement.classList.remove('hidden');
                };

                document.getElementById('loadingView').classList.add('hidden');
                document.getElementById('resultView').classList.remove('hidden');

            } catch (err) {
                alert('حدث خطأ: ' + err.message);
                document.getElementById('loadingView').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
